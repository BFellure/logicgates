<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Gate Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 760px;
            padding: 20px;
            box-sizing: border-box;
        }
        .sim-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
            width: 100%;
            box-sizing: border-box;
        }

        /* Gates Layout */
        .gates-layout {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }
        .gates-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .gate-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease;
        }
        .gate-box.single-center {
            max-width: 360px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .gate-box:hover {
            border-color: #cbd5e1;
        }

        /* SVG Schematic Container */
        svg {
            width: 100%;
            max-width: 320px;
            height: 90px;
            overflow: visible;
        }

        /* Dynamic Signal Wires */
        .wire {
            stroke: #94a3b8;
            stroke-width: 3;
            transition: stroke 0.2s ease;
        }
        .wire.active {
            stroke: #ef4444;
            animation: wirePulse 1.2s infinite linear;
        }
        @keyframes wirePulse {
            0% { stroke-opacity: 1; stroke-dasharray: 4, 4; stroke-dashoffset: 8; }
            100% { stroke-opacity: 1; stroke-dasharray: 4, 4; stroke-dashoffset: 0; }
        }

        .gate-shape {
            fill: #ffffff;
            stroke: #0284c7;
            stroke-width: 3;
        }

        /* Interactive Input Bubbles on SVG */
        .input-node {
            cursor: pointer;
        }
        .input-bubble-bg {
            fill: #e2e8f0;
            stroke: #cbd5e1;
            stroke-width: 2;
            transition: all 0.2s ease;
        }
        .input-node:hover .input-bubble-bg {
            stroke: #0284c7;
            filter: drop-shadow(0 0 4px rgba(2, 132, 199, 0.4));
        }
        .input-node.active .input-bubble-bg {
            fill: #ef4444;
            stroke: #dc2626;
            filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.5));
        }
        .input-text {
            font-size: 11px;
            font-weight: 800;
            fill: #475569;
            user-select: none;
            pointer-events: none;
        }
        .input-node.active .input-text {
            fill: #ffffff;
        }

        /* Output Bulb Integrated directly on SVG output wire */
        .output-bulb-bg {
            fill: #e2e8f0;
            stroke: #cbd5e1;
            stroke-width: 2;
            transition: all 0.25s ease;
        }
        .output-bulb-bg.lit {
            fill: #fef08a;
            stroke: #eab308;
            filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.8));
        }
        .output-text {
            font-size: 12px;
            font-weight: 800;
            fill: #64748b;
            user-select: none;
            pointer-events: none;
        }
        .output-text.lit {
            fill: #854d0e;
        }

        /* Controls */
        .controls-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .sim-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }
        .sim-btn:hover {
            background: #334155;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="sim-card">

        <div class="gates-layout">
            <!-- NOT Gate (Connected to Input C) -->
            <div class="gate-box single-center">
                <svg viewBox="0 0 240 80">
                    <!-- Input Bubble C -->
                    <g class="input-node" id="node_C" onclick="toggleInput('C')">
                        <circle cx="22" cy="40" r="14" class="input-bubble-bg" id="bubble_C"/>
                        <text x="22" y="44" text-anchor="middle" class="input-text" id="text_C">C: 0</text>
                    </g>
                    <!-- Input Wire -->
                    <line x1="36" y1="40" x2="70" y2="40" class="wire" id="wire_not_in"/>
                    <!-- NOT Symbol -->
                    <polygon points="70,18 70,62 118,40" class="gate-shape"/>
                    <circle cx="123" cy="40" r="5" class="gate-shape"/>
                    <!-- Output Wire into Output Bulb -->
                    <line x1="128" y1="40" x2="182" y2="40" class="wire" id="wire_not_out"/>
                    <!-- Connected Output Bulb -->
                    <circle cx="198" cy="40" r="16" class="output-bulb-bg" id="bulb_not"/>
                    <text x="198" y="45" text-anchor="middle" class="output-text" id="outtext_not">0</text>
                </svg>
            </div>

            <div class="gates-row">
                <!-- NAND Gate (Connected to Inputs A and B) -->
                <div class="gate-box">
                    <svg viewBox="0 0 240 80">
                        <!-- Input Bubble A -->
                        <g class="input-node" id="node_nand_A" onclick="toggleInput('A')">
                            <circle cx="22" cy="22" r="14" class="input-bubble-bg" id="bubble_nand_A"/>
                            <text x="22" y="26" text-anchor="middle" class="input-text" id="text_nand_A">A: 0</text>
                        </g>
                        <!-- Input Bubble B -->
                        <g class="input-node" id="node_nand_B" onclick="toggleInput('B')">
                            <circle cx="22" cy="58" r="14" class="input-bubble-bg" id="bubble_nand_B"/>
                            <text x="22" y="62" text-anchor="middle" class="input-text" id="text_nand_B">B: 0</text>
                        </g>
                        <!-- Input Wires -->
                        <line x1="36" y1="22" x2="70" y2="22" class="wire" id="wire_nand_a"/>
                        <line x1="36" y1="58" x2="70" y2="58" class="wire" id="wire_nand_b"/>
                        <!-- NAND Symbol -->
                        <path d="M 70 14 L 92 14 A 26 26 0 0 1 92 66 L 70 66 Z" class="gate-shape"/>
                        <circle cx="123" cy="40" r="5" class="gate-shape"/>
                        <!-- Output Wire into Output Bulb -->
                        <line x1="128" y1="40" x2="182" y2="40" class="wire" id="wire_nand_out"/>
                        <!-- Connected Output Bulb -->
                        <circle cx="198" cy="40" r="16" class="output-bulb-bg" id="bulb_nand"/>
                        <text x="198" y="45" text-anchor="middle" class="output-text" id="outtext_nand">0</text>
                    </svg>
                </div>

                <!-- NOR Gate (Connected to Inputs A and B) -->
                <div class="gate-box">
                    <svg viewBox="0 0 240 80">
                        <!-- Input Bubble A -->
                        <g class="input-node" id="node_nor_A" onclick="toggleInput('A')">
                            <circle cx="22" cy="22" r="14" class="input-bubble-bg" id="bubble_nor_A"/>
                            <text x="22" y="26" text-anchor="middle" class="input-text" id="text_nor_A">A: 0</text>
                        </g>
                        <!-- Input Bubble B -->
                        <g class="input-node" id="node_nor_B" onclick="toggleInput('B')">
                            <circle cx="22" cy="58" r="14" class="input-bubble-bg" id="bubble_nor_B"/>
                            <text x="22" y="62" text-anchor="middle" class="input-text" id="text_nor_B">B: 0</text>
                        </g>
                        <!-- Input Wires -->
                        <line x1="36" y1="22" x2="68" y2="22" class="wire" id="wire_nor_a"/>
                        <line x1="36" y1="58" x2="68" y2="58" class="wire" id="wire_nor_b"/>
                        <!-- NOR Symbol -->
                        <path d="M 64 14 Q 80 40 64 66 Q 98 66 118 40 Q 98 14 64 14 Z" class="gate-shape"/>
                        <circle cx="123" cy="40" r="5" class="gate-shape"/>
                        <!-- Output Wire into Output Bulb -->
                        <line x1="128" y1="40" x2="182" y2="40" class="wire" id="wire_nor_out"/>
                        <!-- Connected Output Bulb -->
                        <circle cx="198" cy="40" r="16" class="output-bulb-bg" id="bulb_nor"/>
                        <text x="198" y="45" text-anchor="middle" class="output-text" id="outtext_nor">0</text>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Reset Button -->
        <div class="controls-row">
            <button class="sim-btn" onclick="resetInputs()">Reset Inputs</button>
        </div>
    </div>
</div>

<script>
    let inputA = 0;
    let inputB = 0;
    let inputC = 0;

    let audioCtx = null;
    function playClick() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        } catch(e) {}
    }

    function toggleInput(target) {
        playClick();
        if (target === 'A') inputA = inputA === 0 ? 1 : 0;
        if (target === 'B') inputB = inputB === 0 ? 1 : 0;
        if (target === 'C') inputC = inputC === 0 ? 1 : 0;
        updateSimulator();
    }

    function resetInputs() {
        playClick();
        inputA = 0;
        inputB = 0;
        inputC = 0;
        updateSimulator();
    }

    function updateSimulator() {
        // Calculate outputs
        const notOut = inputC === 0 ? 1 : 0;
        const nandOut = (inputA === 1 && inputB === 1) ? 0 : 1;
        const norOut = (inputA === 1 || inputB === 1) ? 0 : 1;

        // Update Input Nodes (A, B, C)
        updateInputNode('C', inputC);
        updateInputNode('nand_A', inputA, 'A');
        updateInputNode('nand_B', inputB, 'B');
        updateInputNode('nor_A', inputA, 'A');
        updateInputNode('nor_B', inputB, 'B');

        // Update Wires
        setWire('wire_not_in', inputC);
        setWire('wire_not_out', notOut);

        setWire('wire_nand_a', inputA);
        setWire('wire_nand_b', inputB);
        setWire('wire_nand_out', nandOut);

        setWire('wire_nor_a', inputA);
        setWire('wire_nor_b', inputB);
        setWire('wire_nor_out', norOut);

        // Update Output Bulbs
        setOutputBulb('bulb_not', 'outtext_not', notOut);
        setOutputBulb('bulb_nand', 'outtext_nand', nandOut);
        setOutputBulb('bulb_nor', 'outtext_nor', norOut);
    }

    function updateInputNode(id, state, label) {
        const name = label || id;
        const node = document.getElementById(`node_${id}`);
        const text = document.getElementById(`text_${id}`);
        if (node) {
            node.classList.toggle('active', state === 1);
        }
        if (text) {
            text.textContent = `${name}: ${state}`;
        }
    }

    function setWire(wireId, state) {
        const wire = document.getElementById(wireId);
        if (wire) {
            wire.classList.toggle('active', state === 1);
        }
    }

    function setOutputBulb(bulbId, textId, state) {
        const bulb = document.getElementById(bulbId);
        const text = document.getElementById(textId);
        if (bulb) {
            bulb.classList.toggle('lit', state === 1);
        }
        if (text) {
            text.textContent = state;
            text.classList.toggle('lit', state === 1);
        }
    }

    // Initial render
    updateSimulator();
</script>

</body>
</html>

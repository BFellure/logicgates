<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Gate Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 760px;
            padding: 20px;
            box-sizing: border-box;
        }
        .sim-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
            width: 100%;
            box-sizing: border-box;
        }

        /* Gates Layout */
        .gates-layout {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }
        .gates-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .gate-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease;
        }
        .gate-box.single-center {
            max-width: 360px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .gate-box:hover {
            border-color: #cbd5e1;
        }

        /* SVG Schematic Container */
        svg {
            width: 100%;
            max-width: 320px;
            height: 95px;
            overflow: visible;
        }

        /* Dynamic Signal Wires */
        .wire {
            stroke: #94a3b8;
            stroke-width: 3;
            transition: stroke 0.2s ease;
        }
        .wire.active {
            stroke: #ef4444;
            animation: wirePulse 1.2s infinite linear;
        }
        @keyframes wirePulse {
            0% { stroke-opacity: 1; stroke-dasharray: 4, 4; stroke-dashoffset: 8; }
            100% { stroke-opacity: 1; stroke-dasharray: 4, 4; stroke-dashoffset: 0; }
        }

        .gate-shape {
            fill: #ffffff;
            stroke: #0284c7;
            stroke-width: 3;
        }

        /* Interactive Input Bubbles on SVG */
        .input-node {
            cursor: pointer;
        }
        .input-bubble-bg {
            fill: #e2e8f0;
            stroke: #cbd5e1;
            stroke-width: 2;
            transition: all 0.2s ease;
        }
        .input-node:hover .input-bubble-bg {
            stroke: #0284c7;
            filter: drop-shadow(0 0 4px rgba(2, 132, 199, 0.4));
        }
        .input-node.active .input-bubble-bg {
            fill: #ef4444;
            stroke: #dc2626;
            filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.5));
        }
        .input-label-text {
            font-size: 11px;
            font-weight: 800;
            fill: #475569;
            user-select: none;
            pointer-events: none;
        }
        .input-digit-text {
            font-size: 12px;
            font-weight: 800;
            fill: #475569;
            user-select: none;
            pointer-events: none;
        }
        .input-node.active .input-digit-text {
            fill: #ffffff;
        }

        /* Output Bulb Integrated directly on SVG output wire */
        .output-bulb-bg {
            fill: #e2e8f0;
            stroke: #cbd5e1;
            stroke-width: 2;
            transition: all 0.25s ease;
        }
        .output-bulb-bg.lit {
            fill: #fef08a;
            stroke: #eab308;
            filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.8));
        }
        .output-label-text {
            font-size: 9px;
            font-weight: 800;
            fill: #64748b;
            user-select: none;
            pointer-events: none;
        }
        .output-text {
            font-size: 12px;
            font-weight: 800;
            fill: #64748b;
            user-select: none;
            pointer-events: none;
        }
        .output-text.lit {
            fill: #854d0e;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="sim-card">
        <div class="gates-layout">
            <!-- NOT Gate (Connected to Input A) -->
            <div class="gate-box single-center">
                <svg viewBox="0 0 240 85">
                    <!-- Input Label A above Bubble -->
                    <text x="22" y="14" text-anchor="middle" class="input-label-text">A</text>
                    <!-- Input Bubble A -->
                    <g class="input-node" id="node_not_A" onclick="toggleInput('A')">
                        <circle cx="22" cy="42" r="14" class="input-bubble-bg" id="bubble_not_A"/>
                        <text x="22" y="46" text-anchor="middle" class="input-digit-text" id="digit_not_A">0</text>
                    </g>
                    <!-- Input Wire -->
                    <line x1="36" y1="42" x2="70" y2="42" class="wire" id="wire_not_in"/>
                    <!-- NOT Symbol -->
                    <polygon points="70,20 70,64 118,42" class="gate-shape"/>
                    <circle cx="123" cy="42" r="5" class="gate-shape"/>
                    <!-- Output Wire into Output Bulb -->
                    <line x1="128" y1="42" x2="182" y2="42" class="wire" id="wire_not_out"/>
                    <!-- Connected Output Bulb -->
                    <text x="198" y="14" text-anchor="middle" class="output-label-text">OUT</text>
                    <circle cx="198" cy="42" r="16" class="output-bulb-bg" id="bulb_not"/>
                    <text x="198" y="47" text-anchor="middle" class="output-text" id="outtext_not">0</text>
                </svg>
            </div>

            <div class="gates-row">
                <!-- NAND Gate (Connected to Inputs A and B) -->
                <div class="gate-box">
                    <svg viewBox="0 0 240 85">
                        <!-- Input Label A -->
                        <text x="22" y="10" text-anchor="middle" class="input-label-text">A</text>
                        <!-- Input Bubble A -->
                        <g class="input-node" id="node_nand_A" onclick="toggleInput('A')">
                            <circle cx="22" cy="28" r="13" class="input-bubble-bg" id="bubble_nand_A"/>
                            <text x="22" y="32" text-anchor="middle" class="input-digit-text" id="digit_nand_A">0</text>
                        </g>

                        <!-- Input Label B -->
                        <text x="22" y="48" text-anchor="middle" class="input-label-text">B</text>
                        <!-- Input Bubble B -->
                        <g class="input-node" id="node_nand_B" onclick="toggleInput('B')">
                            <circle cx="22" cy="66" r="13" class="input-bubble-bg" id="bubble_nand_B"/>
                            <text x="22" y="70" text-anchor="middle" class="input-digit-text" id="digit_nand_B">0</text>
                        </g>

                        <!-- Input Wires -->
                        <line x1="35" y1="28" x2="70" y2="28" class="wire" id="wire_nand_a"/>
                        <line x1="35" y1="66" x2="70" y2="66" class="wire" id="wire_nand_b"/>

                        <!-- NAND Symbol -->
                        <path d="M 70 20 L 92 20 A 24 24 0 0 1 92 74 L 70 74 Z" class="gate-shape"/>
                        <circle cx="121" cy="47" r="5" class="gate-shape"/>

                        <!-- Output Wire into Output Bulb -->
                        <line x1="126" y1="47" x2="182" y2="47" class="wire" id="wire_nand_out"/>
                        <!-- Connected Output Bulb -->
                        <text x="198" y="18" text-anchor="middle" class="output-label-text">OUT</text>
                        <circle cx="198" cy="47" r="16" class="output-bulb-bg" id="bulb_nand"/>
                        <text x="198" y="52" text-anchor="middle" class="output-text" id="outtext_nand">0</text>
                    </svg>
                </div>

                <!-- NOR Gate (Connected to Inputs A and B) -->
                <div class="gate-box">
                    <svg viewBox="0 0 240 85">
                        <!-- Input Label A -->
                        <text x="22" y="10" text-anchor="middle" class="input-label-text">A</text>
                        <!-- Input Bubble A -->
                        <g class="input-node" id="node_nor_A" onclick="toggleInput('A')">
                            <circle cx="22" cy="28" r="13" class="input-bubble-bg" id="bubble_nor_A"/>
                            <text x="22" y="32" text-anchor="middle" class="input-digit-text" id="digit_nor_A">0</text>
                        </g>

                        <!-- Input Label B -->
                        <text x="22" y="48" text-anchor="middle" class="input-label-text">B</text>
                        <!-- Input Bubble B -->
                        <g class="input-node" id="node_nor_B" onclick="toggleInput('B')">
                            <circle cx="22" cy="66" r="13" class="input-bubble-bg" id="bubble_nor_B"/>
                            <text x="22" y="70" text-anchor="middle" class="input-digit-text" id="digit_nor_B">0</text>
                        </g>

                        <!-- Input Wires -->
                        <line x1="35" y1="28" x2="68" y2="28" class="wire" id="wire_nor_a"/>
                        <line x1="35" y1="66" x2="68" y2="66" class="wire" id="wire_nor_b"/>

                        <!-- NOR Symbol -->
                        <path d="M 64 20 Q 80 47 64 74 Q 98 74 118 47 Q 98 20 64 20 Z" class="gate-shape"/>
                        <circle cx="123" cy="47" r="5" class="gate-shape"/>

                        <!-- Output Wire into Output Bulb -->
                        <line x1="128" y1="47" x2="182" y2="47" class="wire" id="wire_nor_out"/>
                        <!-- Connected Output Bulb -->
                        <text x="198" y="18" text-anchor="middle" class="output-label-text">OUT</text>
                        <circle cx="198" cy="47" r="16" class="output-bulb-bg" id="bulb_nor"/>
                        <text x="198" y="52" text-anchor="middle" class="output-text" id="outtext_nor">0</text>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let inputA = 0;
    let inputB = 0;

    let audioCtx = null;
    function playClick() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        } catch(e) {}
    }

    function toggleInput(target) {
        playClick();
        if (target === 'A') inputA = inputA === 0 ? 1 : 0;
        if (target === 'B') inputB = inputB === 0 ? 1 : 0;
        updateSimulator();
    }

    function updateSimulator() {
        // Calculate outputs
        const notOut = inputA === 0 ? 1 : 0;
        const nandOut = (inputA === 1 && inputB === 1) ? 0 : 1;
        const norOut = (inputA === 1 || inputB === 1) ? 0 : 1;

        // Update Input Bubbles
        updateInputNode('not_A', inputA);
        updateInputNode('nand_A', inputA);
        updateInputNode('nand_B', inputB);
        updateInputNode('nor_A', inputA);
        updateInputNode('nor_B', inputB);

        // Update Wires
        setWire('wire_not_in', inputA);
        setWire('wire_not_out', notOut);

        setWire('wire_nand_a', inputA);
        setWire('wire_nand_b', inputB);
        setWire('wire_nand_out', nandOut);

        setWire('wire_nor_a', inputA);
        setWire('wire_nor_b', inputB);
        setWire('wire_nor_out', norOut);

        // Update Output Bulbs
        setOutputBulb('bulb_not', 'outtext_not', notOut);
        setOutputBulb('bulb_nand', 'outtext_nand', nandOut);
        setOutputBulb('bulb_nor', 'outtext_nor', norOut);
    }

    function updateInputNode(id, state) {
        const node = document.getElementById(`node_${id}`);
        const digit = document.getElementById(`digit_${id}`);
        if (node) {
            node.classList.toggle('active', state === 1);
        }
        if (digit) {
            digit.textContent = state;
        }
    }

    function setWire(wireId, state) {
        const wire = document.getElementById(wireId);
        if (wire) {
            wire.classList.toggle('active', state === 1);
        }
    }

    function setOutputBulb(bulbId, textId, state) {
        const bulb = document.getElementById(bulbId);
        const text = document.getElementById(textId);
        if (bulb) {
            bulb.classList.toggle('lit', state === 1);
        }
        if (text) {
            text.textContent = state;
            text.classList.toggle('lit', state === 1);
        }
    }

    // Initial render
    updateSimulator();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Gate Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 720px;
            padding: 20px;
            box-sizing: border-box;
        }
        .sim-card {
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
            width: 100%;
            box-sizing: border-box;
        }

        /* Inputs Section */
        .inputs-section {
            display: flex;
            justify-content: center;
            gap: 40px;
            background: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
        }
        .input-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .input-label {
            font-size: 0.9rem;
            font-weight: 800;
            color: #475569;
            letter-spacing: 0.05em;
        }
        .toggle-btn {
            background: #e2e8f0;
            color: #475569;
            border: 2px solid #cbd5e1;
            padding: 8px 0;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 75px;
            text-align: center;
        }
        .toggle-btn.active {
            background: #ef4444;
            color: white;
            border-color: #dc2626;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* Gates Grid */
        .gates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
        .gate-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease;
        }
        .gate-box:hover {
            border-color: #cbd5e1;
        }

        /* SVG Schematic Container */
        .schematic-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 240px;
        }
        svg {
            width: 130px;
            height: 70px;
        }

        /* Dynamic Signal Wire & Pulse Animation */
        .wire {
            stroke: #94a3b8;
            stroke-width: 3;
            transition: stroke 0.2s ease;
        }
        .wire.active {
            stroke: #ef4444;
            animation: wirePulse 1.2s infinite linear;
        }
        @keyframes wirePulse {
            0% { stroke-opacity: 1; stroke-dasharray: 4, 4; stroke-dashoffset: 8; }
            100% { stroke-opacity: 1; stroke-dasharray: 4, 4; stroke-dashoffset: 0; }
        }

        .gate-shape {
            fill: #ffffff;
            stroke: #0284c7;
            stroke-width: 3;
        }

        /* Output Bulb Indicator */
        .output-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .output-label {
            font-size: 0.7rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .output-bulb {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1rem;
            color: #64748b;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .output-bulb.lit {
            background: #fef08a;
            border-color: #eab308;
            color: #854d0e;
            box-shadow: 0 0 16px rgba(234, 179, 8, 0.6);
            transform: scale(1.05);
            animation: bulbGlow 1.5s infinite alternate;
        }
        @keyframes bulbGlow {
            0% { box-shadow: 0 0 12px rgba(234, 179, 8, 0.5); }
            100% { box-shadow: 0 0 20px rgba(234, 179, 8, 0.8); }
        }

        /* Controls */
        .controls-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .sim-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }
        .sim-btn:hover {
            background: #334155;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="sim-card">
        <!-- Input Switches -->
        <div class="inputs-section">
            <div class="input-control">
                <span class="input-label">A</span>
                <button class="toggle-btn" id="switchA" onclick="toggleInput('A')">0</button>
            </div>
            <div class="input-control">
                <span class="input-label">B</span>
                <button class="toggle-btn" id="switchB" onclick="toggleInput('B')">0</button>
            </div>
        </div>

        <!-- Logic Gates Display Grid with Connected Schematic Symbols -->
        <div class="gates-grid">
            <!-- NOT A -->
            <div class="gate-box">
                <div class="schematic-container">
                    <svg viewBox="0 0 100 60">
                        <line x1="0" y1="30" x2="25" y2="30" class="wire" id="wire_notA_in"/>
                        <polygon points="25,12 25,48 62,30" class="gate-shape"/>
                        <circle cx="67" cy="30" r="4" class="gate-shape"/>
                        <line x1="71" y1="30" x2="100" y2="30" class="wire" id="wire_notA_out"/>
                    </svg>
                    <div class="output-indicator">
                        <span class="output-label">OUT</span>
                        <div class="output-bulb" id="bulbNotA">0</div>
                    </div>
                </div>
            </div>

            <!-- NOT B -->
            <div class="gate-box">
                <div class="schematic-container">
                    <svg viewBox="0 0 100 60">
                        <line x1="0" y1="30" x2="25" y2="30" class="wire" id="wire_notB_in"/>
                        <polygon points="25,12 25,48 62,30" class="gate-shape"/>
                        <circle cx="67" cy="30" r="4" class="gate-shape"/>
                        <line x1="71" y1="30" x2="100" y2="30" class="wire" id="wire_notB_out"/>
                    </svg>
                    <div class="output-indicator">
                        <span class="output-label">OUT</span>
                        <div class="output-bulb" id="bulbNotB">0</div>
                    </div>
                </div>
            </div>

            <!-- NAND -->
            <div class="gate-box">
                <div class="schematic-container">
                    <svg viewBox="0 0 100 60">
                        <line x1="0" y1="20" x2="25" y2="20" class="wire" id="wire_nand_a"/>
                        <line x1="0" y1="40" x2="25" y2="40" class="wire" id="wire_nand_b"/>
                        <path d="M 25 12 L 42 12 A 18 18 0 0 1 42 48 L 25 48 Z" class="gate-shape"/>
                        <circle cx="64" cy="30" r="4" class="gate-shape"/>
                        <line x1="68" y1="30" x2="100" y2="30" class="wire" id="wire_nand_out"/>
                    </svg>
                    <div class="output-indicator">
                        <span class="output-label">OUT</span>
                        <div class="output-bulb" id="bulbNand">0</div>
                    </div>
                </div>
            </div>

            <!-- NOR -->
            <div class="gate-box">
                <div class="schematic-container">
                    <svg viewBox="0 0 100 60">
                        <line x1="0" y1="20" x2="23" y2="20" class="wire" id="wire_nor_a"/>
                        <line x1="0" y1="40" x2="23" y2="40" class="wire" id="wire_nor_b"/>
                        <path d="M 20 12 Q 32 30 20 48 Q 45 48 62 30 Q 45 12 20 12 Z" class="gate-shape"/>
                        <circle cx="67" cy="30" r="4" class="gate-shape"/>
                        <line x1="71" y1="30" x2="100" y2="30" class="wire" id="wire_nor_out"/>
                    </svg>
                    <div class="output-indicator">
                        <span class="output-label">OUT</span>
                        <div class="output-bulb" id="bulbNor">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reset Button -->
        <div class="controls-row">
            <button class="sim-btn" onclick="resetInputs()">Reset Inputs</button>
        </div>
    </div>
</div>

<script>
    let inputA = 0;
    let inputB = 0;

    let audioCtx = null;
    function playClick() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        } catch(e) {}
    }

    function toggleInput(target) {
        playClick();
        if (target === 'A') {
            inputA = inputA === 0 ? 1 : 0;
        } else if (target === 'B') {
            inputB = inputB === 0 ? 1 : 0;
        }
        updateSimulator();
    }

    function resetInputs() {
        playClick();
        inputA = 0;
        inputB = 0;
        updateSimulator();
    }

    function updateSimulator() {
        // Toggle Buttons
        const btnA = document.getElementById('switchA');
        const btnB = document.getElementById('switchB');

        btnA.textContent = inputA;
        btnA.classList.toggle('active', inputA === 1);

        btnB.textContent = inputB;
        btnB.classList.toggle('active', inputB === 1);

        // Calculate Logic Out
        const notA = inputA === 0 ? 1 : 0;
        const notB = inputB === 0 ? 1 : 0;
        const nandOut = (inputA === 1 && inputB === 1) ? 0 : 1;
        const norOut = (inputA === 1 || inputB === 1) ? 0 : 1;

        // Set Bulbs
        setBulb('bulbNotA', notA);
        setBulb('bulbNotB', notB);
        setBulb('bulbNand', nandOut);
        setBulb('bulbNor', norOut);

        // Update Dynamic Wires
        setWire('wire_notA_in', inputA);
        setWire('wire_notA_out', notA);

        setWire('wire_notB_in', inputB);
        setWire('wire_notB_out', notB);

        setWire('wire_nand_a', inputA);
        setWire('wire_nand_b', inputB);
        setWire('wire_nand_out', nandOut);

        setWire('wire_nor_a', inputA);
        setWire('wire_nor_b', inputB);
        setWire('wire_nor_out', norOut);
    }

    function setBulb(bulbId, state) {
        const bulb = document.getElementById(bulbId);
        bulb.textContent = state;
        if (state === 1) {
            bulb.classList.add('lit');
        } else {
            bulb.classList.remove('lit');
        }
    }

    function setWire(wireId, state) {
        const wire = document.getElementById(wireId);
        if (wire) {
            if (state === 1) {
                wire.classList.add('active');
            } else {
                wire.classList.remove('active');
            }
        }
    }

    // Initial render
    updateSimulator();
</script>

</body>
</html>

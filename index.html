<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Gate Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 760px;
            padding: 20px;
            box-sizing: border-box;
        }
        .sim-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
            width: 100%;
            box-sizing: border-box;
        }

        /* Gates Layout */
        .gates-layout {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }
        .gates-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .gate-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease;
        }
        .gate-box.single-center {
            max-width: 360px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .gate-box:hover {
            border-color: #cbd5e1;
        }

        /* SVG Schematic Container */
        svg {
            width: 100%;
            max-width: 320px;
            height: 100px;
            overflow: visible;
        }

        /* Dynamic Signal Wires */
        .wire {
            stroke: #94a3b8;
            stroke-width: 3;
            transition: stroke 0.2s ease;
        }
        .wire.active {
            stroke: #ef4444;
            animation: wirePulse 1.2s infinite linear;
        }
        @keyframes wirePulse {
            0% { stroke-opacity: 1; stroke-dasharray: 4, 4; stroke-dashoffset: 8; }
            100% { stroke-opacity: 1; stroke-dasharray: 4, 4; stroke-dashoffset: 0; }
        }

        .gate-shape {
            fill: #ffffff;
            stroke: #0284c7;
            stroke-width: 3;
        }

        /* Interactive Input Bubbles on SVG */
        .input-node {
            cursor: pointer;
        }
        .input-bubble-bg {
            fill: #e2e8f0;
            stroke: #cbd5e1;
            stroke-width: 2;
            transition: all 0.2s ease;
        }
        .input-node:hover .input-bubble-bg {
            stroke: #0284c7;
            filter: drop-shadow(0 0 4px rgba(2, 132, 199, 0.4));
        }
        .input-node.active .input-bubble-bg {
            fill: #ef4444;
            stroke: #dc2626;
            filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.5));
        }
        .input-label-text {
            font-size: 11px;
            font-weight: 800;
            fill: #475569;
            user-select: none;
            pointer-events: none;
        }
        .input-digit-text {
            font-size: 12px;
            font-weight: 800;
            fill: #475569;
            user-select: none;
            pointer-events: none;
        }
        .input-node.active .input-digit-text {
            fill: #ffffff;
        }

        /* Output Bulb Integrated directly on SVG output wire */
        .output-bulb-bg {
            fill: #e2e8f0;
            stroke: #cbd5e1;
            stroke-width: 2;
            transition: all 0.25s ease;
        }
        .output-bulb-bg.lit {
            fill: #fef08a;
            stroke: #eab308;
            filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.8));
        }
        .output-label-text {
            font-size: 9px;
            font-weight: 800;
            fill: #64748b;
            user-select: none;
            pointer-events: none;
        }
